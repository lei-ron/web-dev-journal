<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layouts</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="grid-container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item">3</div>

        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item item6">6</div>
      </div>
    </div>

    <div class="container-test">
      <h1>Basic Grid (3x3)</h1>
      <div class="basic-grid1">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
      </div>
    </div>

    <div class="container-test">
      <h1>Grid with Different Column Sizes</h1>
      <div class="basic-grid2">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
      </div>
    </div>

    <div class="container-test">
      <h1>Grid with Gaps</h1>
      <div class="basic-grid3">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
      </div>
    </div>

    <div class="container-test">
      <h1>Grid Item Placement</h1>
      <div class="basic-grid4">
        <div class="box placement1">1</div>
        <div class="box placement2">2</div>
        <div class="box placement3">3</div>
        <div class="box placement4">4</div>
        <div class="box">5</div>
        <div class="box placement6">6</div>
      </div>
    </div>
  </body>
</html>
