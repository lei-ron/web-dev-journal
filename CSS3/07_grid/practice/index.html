<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layouts</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1 class="grid">GRID</h1>
    <div class="container basic-grid-container">
      <ul>
        <li>Basic Grid (3x3)</li>
      </ul>
      <div class="container-box basic-grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
      </div>
    </div>

    <div class="container sized-grid-container">
      <ul>
        <li>Different Sizes</li>
      </ul>
      <div class="container-box sized-grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
      </div>
    </div>

    <div class="container gapped-grid-container">
      <ul>
        <li>Gaps</li>
      </ul>
      <div class="container-box gapped-grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
      </div>
    </div>

    <div class="container placed-grid-container">
      <ul>
        <li>Placements</li>
      </ul>
      <div class="container-box placed-grid">
        <div class="box placed-box1">1</div>
        <div class="box placed-box2">2</div>
        <div class="box placed-box3">3</div>
        <div class="box placed-box4">4</div>
      </div>
    </div>

    <div class="container template-grid-container">
      <ul>
        <li>Template</li>
      </ul>
      <div class="container-box template-grid">
        <div class="box header">Header</div>
        <div class="box sidebar">Sidebar</div>
        <div class="box main">Main Content</div>
        <div class="box footer">Footer</div>
      </div>
    </div>

    <h1 class="flex">FLEX</h1>
  </body>
</html>
