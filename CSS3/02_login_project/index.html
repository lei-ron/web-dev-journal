<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Login Page</title>
  </head>
  <body>
    <div class="card">
      <h2>Log In</h2>

      <form action="">
        <label for="email"
          >Email:
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Type your email."
        /></label>

        <label for="password"
          >Password:
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Type your password."
        /></label>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
